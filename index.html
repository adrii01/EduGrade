    <script>
      (function() {
        try {
          var originalFetch = window.fetch;
          var activeFetch = originalFetch;
          Object.defineProperty(window, 'fetch', {
            get: function() {
              return activeFetch;
            },
            set: function(val) {
              activeFetch = val;
            },
            configurable: true,
            enumerable: true
          });
        } catch (e) {
          try {
            var proto = Object.getPrototypeOf(window) || Window.prototype;
            var desc = Object.getOwnPropertyDescriptor(proto, 'fetch');
            if (desc && !desc.set) {
              Object.defineProperty(proto, 'fetch', {
                get: function() {
                  return window._activeFetch || (desc.get ? desc.get.call(this) : originalFetch);
                },
                set: function(val) {
                  window._activeFetch = val;
                },
                configurable: true,
                enumerable: true
              });
            }
          } catch (e2) {
            // Ignore
          }
        }
      })();
    </script>
